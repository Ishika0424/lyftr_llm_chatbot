services:
  # Backend FastAPI Web Service
  - type: web
    name: lyftr-llm-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: LLM_API_KEYS
        value: "mock_key_1,mock_key_2"
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DEFAULT_MODEL
        value: gemini/gemini-2.0-flash

  # Frontend React Static Site
  - type: web
    name: lyftr-llm-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://lyftr-llm-backend.onrender.com
